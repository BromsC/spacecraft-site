name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Empty until the Tina Cloud project is set up (see docs/STATE.md).
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # base_path is "" once the custom domain is set in Settings → Pages,
      # "/spacecraft-site" before that (github.io preview).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Export base path
        run: echo "BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"

      - name: Build Tina admin
        if: ${{ env.TINA_CLIENT_ID != '' }}
        run: npx tinacms build

      - name: Skip Tina admin (no TINA_CLIENT_ID secret)
        if: ${{ env.TINA_CLIENT_ID == '' }}
        run: echo "::notice::TINA_CLIENT_ID secret not set — building site without /admin."

      - name: Build site
        run: npx astro build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
